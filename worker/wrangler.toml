#:schema node_modules/wrangler/config-schema.json
# Cloudflare Worker for the account API (docs/11).

# The game itself stays a static site on Pages or Vercel; only this is a Worker.
name = "nong-trai-account"
main = "src/index.ts"
compatibility_date = "2026-01-15"

# KV holds what it is good at: account records, session-adjacent keys and the
# garden save blobs — one value per key, read and written whole.
[[kv_namespaces]]
binding = "DB"
id = "f9a6984ac59f4d70b032516f08aa8316"

# D1 holds the relational data: friends, duel correspondence, search indexes and
# the leaderboard — data that was previously stored as whole-list JSON blobs in
# KV, which cost a rewrite per mutation and hit the free tier's ~1k daily write
# cap inside an idle afternoon. Apply schema.sql once:
#   npx wrangler d1 execute nong-trai-db --remote --file=schema.sql
[[d1_databases]]
binding = "D1"
database_name = "nong-trai-db"
database_id = "ec7677e8-fc26-4a51-9769-7e4f63124cb8"

# R2 holds the large write-once payloads: duel replays (the two full plant
# snapshots plus the whole event log). Read-once blobs, exactly what object
# storage is for — and out of the KV budget entirely.
#
# Bound but currently commented out: R2 needs a one-time activation in the
# Cloudflare Dashboard (R2 → Enable) before `wrangler r2 bucket create` works.
# Until then `REPLAYS` is unbound and duel results land in the D1
# `duel_results` table — same wire contract, just stored as a row.
# To enable: activate R2 in the dashboard, run
#   npx wrangler r2 bucket create nong-trai-replays
# then uncomment:
# [[r2_buckets]]
# binding = "REPLAYS"
# bucket_name = "nong-trai-replays"

# The room mailbox: one Durable Object per room code. KV could relay messages but
# its edge cache kept a written join invisible for up to a minute — measured ~30 s —
# which looked like rooms never working. DO storage is strongly consistent, so a
# send is visible to the very next poll. If this binding is removed, /api/room falls
# back to the KV relay automatically.
[durable_objects]
bindings = [{ name = "ROOMS", class_name = "RoomMailbox" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomMailbox"]

# Secrets are NOT in this file and must never be committed. Set them with:
#   npx wrangler secret put TOKEN_SECRET
#   npx wrangler secret put PBKDF2_ROUNDS
#
# TOKEN_SECRET is any long random string. Generate one with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
# Changing it invalidates every session token, so everyone logs in again.
[vars]
PBKDF2_ROUNDS = "100000"

# GOOGLE_CLIENT_ID is the OAuth client ID of the web app in Google Cloud console.
# It is a var, not a secret: it is public by design and ships in the game's bundle.
# Without it, /api/google answers 503 google_not_configured and password sign-in
# is unaffected.
#
#   npx wrangler secret put GOOGLE_CLIENT_ID
#
# It does NOT need to be a secret. What matters is that it matches
# VITE_GOOGLE_CLIENT_ID in the game's .env, because the token's "aud" claim is
# checked against it and a mismatch refuses every sign-in.
GOOGLE_CLIENT_ID = "985241634573-u19ok6lg1vt7i2f221hr2smrmbs0v3nl.apps.googleusercontent.com"

# Note on the KV tier: the free plan allows roughly 1,000 writes per day. The
# client syncs on login, on demand, and occasionally — not on every mutation —
# because saving per action would exhaust that in an afternoon.
observability = { enabled = true }
