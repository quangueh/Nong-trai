# Build the Android APK shell in CI (no Android SDK lives on dev machines) and
# boot it on a real emulator before anyone installs it.
#
# The APK is a WebView shell pointing at the live Pages URL, so it does NOT need
# rebuilding for game changes — this workflow runs when the shell itself
# (android/, capacitor config, dependency tree) changes, or on demand.
# Every push also publishes the APK as a build artifact; tagged pushes attach
# it to a GitHub Release for easy sideloading.

name: android-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # dist/ is what `cap sync` copies into the APK as the bundled shell —
      # the app loads the live URL first, but this is the offline fallback.
      - name: Build web bundle
        run: npm run build

      - name: Sync into android/
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runner images lag the newest compileSdk — install exactly what the
      # project targets so AGP never fails on a missing platform.
      - name: Ensure Android SDK platform 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - id: meta
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: nong-trai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  emu-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nong-trai-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot smoke — install, launch, verify resumed + no fatal
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -n com.quang.nongtrai/.MainActivity
            sleep 35
            adb shell dumpsys activity activities | grep -E "ResumedActivity|topResumedActivity"
            RESUMED=$(adb shell dumpsys activity activities | grep -oE "com\.quang\.nongtrai[^ ]*" | head -1)
            echo "resumed=$RESUMED"
            if [ -z "$RESUMED" ]; then echo "APP NOT RESUMED"; exit 1; fi
            PID=$(adb shell pidof -s com.quang.nongtrai || true)
            echo "pid=$PID"
            adb logcat -d -v brief | grep -E "FATAL|AndroidRuntime.*com.quang.nongtrai" && exit 1 || true
            adb exec-out screencap -p > apk-smoke.png

      - uses: actions/upload-artifact@v4
        with:
          name: apk-smoke-screenshot
          path: apk-smoke.png
          retention-days: 14

      - name: Attach APK to tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/app-debug.apk
