# Build the Android APK shell in CI (no Android SDK lives on dev machines) and
# boot it on a real emulator before anyone installs it.
#
# The APK is a WebView shell pointing at the live Pages URL, so it does NOT need
# rebuilding for game changes — this workflow runs when the shell itself
# (android/, capacitor config, dependency tree) changes, or on demand.
# Every push also publishes the APK as a build artifact; tagged pushes attach
# it to a GitHub Release for easy sideloading.

name: android-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# contents:write — the smoke-diagnostic step pushes the orphan ci-reports
# branch, and the release step creates GitHub Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # dist/ is what `cap sync` copies into the APK as the bundled shell —
      # the app loads the live URL first, but this is the offline fallback.
      - name: Build web bundle
        run: npm run build

      - name: Sync into android/
        run: npx cap sync android

      # Capacitor 8's android library compiles with JavaVersion.VERSION_21 —
      # JDK 17 fails assembleDebug with "invalid source release: 21".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runner images lag the newest compileSdk — install exactly what the
      # project targets so AGP never fails on a missing platform. Two traps:
      #   1. sdkmanager prompts for licences interactively and Gradle's own
      #      auto-installer cannot accept them at all — pre-seed the well-known
      #      licence hashes so both paths are covered.
      #   2. AGP pins build-tools 35.0.0 (default for this AGP, variables.gradle
      #      does not override) — installing 36.0.0 still fails the build.
      - name: Ensure Android SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - id: meta
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: nong-trai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  emu-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nong-trai-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # Manual emulator drive, not a third-party action — every line is ours,
      # every artifact self-reports. google_apis ships a real WebView (the
      # 'default' target's can be stubbed, and Capacitor needs a real one).
      # google_apis images carry their own license (android-googledk-license) —
      # pre-seed every known hash AND pipe `yes` so no prompt can block.
      - name: Install emulator + system image
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "601085b94e77f3850ca1508e1f9d0be9c7c2a1a9" > "$ANDROID_HOME/licenses/android-googledk-license"
          echo "859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" || \
            { sleep 10; yes | "$SDKM" "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64"; }

      - name: Create AVD and boot emulator
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          IMG="system-images;android-34;google_apis;x86_64"
          AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          # The runner image can set ANDROID_SDK_HOME elsewhere; pinning
          # ANDROID_AVD_HOME keeps create + boot on one avd dir.
          if ! (echo no | "$AVDM" create avd -n smoke -k "$IMG" -d pixel_6 --force) > avd-create.log 2>&1; then
            (echo no | "$AVDM" create avd -n smoke -k "$IMG" --force) >> avd-create.log 2>&1
          fi
          "$AVDM" list avd > avd-list.txt 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed > sdk-installed.txt 2>&1 || true
          if ! grep -q "Name: smoke" avd-list.txt; then
            echo "AVD create failed"; cat avd-create.log; exit 1
          fi
          # adb server FIRST — the emulator registers with :5037 once at
          # launch; if the daemon isn't listening yet it can sit 'offline'
          # forever regardless of reconnect kicks.
          adb start-server || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics > emulator.log 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device || true
          for i in $(seq 1 120); do
            st=$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$st" = "1" ] && break
            # adbd handshakes AFTER boot — on a cold adb server the device can
            # sit 'offline' even though the guest finished booting.
            adb -s emulator-5554 reconnect offline > /dev/null 2>&1 || true
            if [ $((i % 12)) -eq 0 ]; then
              adb kill-server > /dev/null 2>&1 || true
              adb start-server > /dev/null 2>&1 || true
            fi
            sleep 5
          done
          adb devices > adb-devices.txt 2>&1 || true
          [ "${st:-}" = "1" ] || { echo "emulator never booted"; cat adb-devices.txt; tail -50 emulator.log; exit 1; }
          adb -s emulator-5554 shell input keyevent 82 || true

      - name: Smoke — install, launch, verify resumed + no fatal
        run: |
          set -x
          ADB="adb -s emulator-5554"
          $ADB install -r apk/app-debug.apk && INSTALL=ok || INSTALL=fail
          $ADB shell am start -n com.quang.nongtrai/.MainActivity || true
          sleep 35
          $ADB shell dumpsys activity activities > dumpsys.txt || true
          $ADB logcat -d -v brief > logcat.txt || true
          $ADB exec-out screencap -p > apk-smoke.png || true
          # `if`-guarded checks only — a `grep | head` pipeline in $() can die
          # by SIGPIPE under pipefail and abort the script even when the app is
          # healthy. Explicit exit keeps intent unambiguous.
          RESUMED=no
          if grep -qE "(topResumedActivity|ResumedActivity):.*com\.quang\.nongtrai" dumpsys.txt; then RESUMED=yes; fi
          CRASH=no
          if grep -A40 "FATAL EXCEPTION" logcat.txt | grep -q "com\.quang\.nongtrai"; then CRASH=yes; fi
          echo "install=$INSTALL resumed=$RESUMED crash=$CRASH" | tee smoke-status.txt
          if [ "$INSTALL" = "ok" ] && [ "$RESUMED" = "yes" ] && [ "$CRASH" = "no" ]; then exit 0; else exit 1; fi

      # ci-reports is an orphan branch — readable via the public API, unlike
      # Actions logs which need repo auth.
      - name: Publish smoke diagnostics on failure
        if: failure()
        run: |
          git config user.email "ci@local" && git config user.name "ci-bot"
          git fetch origin ci-reports 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/ci-reports; then
            git checkout -B ci-reports-local origin/ci-reports
          else
            git checkout --orphan ci-reports-local && git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "reports/${GITHUB_SHA::7}-apk-smoke"
          for f in dumpsys.txt logcat.txt apk-smoke.png smoke-status.txt emulator.log avd-create.log avd-list.txt adb-devices.txt; do
            [ -f "$f" ] && cp "$f" "reports/${GITHUB_SHA::7}-apk-smoke/"
          done
          git add -A reports && git commit -qm "smoke diag ${GITHUB_SHA::7}" \
            && git push -qf origin HEAD:ci-reports || echo "diag push failed"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-smoke-screenshot
          path: apk-smoke.png
          retention-days: 14

      # Push the verified APK onto GitHub itself: a rolling "apk-latest"
      # release whose download URL never changes —
      #   releases/download/apk-latest/app-debug.apk
      # Only runs after the emulator smoke above passed, so a broken shell
      # can never reach the release page.
      - name: Publish rolling release (apk-latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Nông Trại APK — bản mới nhất"
          body: |
            APK debug build từ commit ${{ needs.build.outputs.sha }} — đã qua emulator boot smoke.

            Cài: chuyển file vào điện thoại → mở → cho phép "install unknown apps".
            Game tự cập nhật theo site mỗi lần mở app; APK chỉ cần cài lại khi shell đổi.
          prerelease: true
          files: apk/app-debug.apk

      - name: Attach APK to tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/app-debug.apk
