# Push → production. The Pages project is direct-upload (not git-linked), so
# this workflow is the bridge that makes "push source → app/site updates" real:
# every push to main builds, runs the technical gates, then deploys dist/ to
# Cloudflare Pages. The APK shell loads that URL — no APK rebuild needed for
# content updates.
#
# Required repo secrets for the deploy step (build+test still run without them):
#   CLOUDFLARE_API_TOKEN   — an API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  — 74e68368993df775a81d79eba2345a1b
# When the secrets are absent the job goes green but prints a notice and skips
# the upload — a missing secret must not masquerade as a failing build.

name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

# contents:write lets the failure-report step push the orphan `ci-reports`
# branch — Actions logs need repo auth to fetch, the branch is readable via API.
permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The technical gate typechecks worker/tsconfig.json — it needs the
      # worker's own node_modules, which the root `npm ci` does not install.
      - run: npm --prefix worker ci --no-audit --no-fund

      - name: Build + typecheck
        run: npm run build

      - name: Technical gates (core)
        run: npm run test:technical

      # The technical runner writes artifacts/technical-tests/<ts>/report.json
      # with every suite's full log before exiting. On failure, push that dir to
      # the orphan `ci-reports` branch so the cause is visible without log auth.
      - name: Publish gate report on failure
        if: failure()
        run: |
          report_dir=$(ls -td artifacts/technical-tests/*/ 2>/dev/null | head -1)
          if [ -z "${report_dir:-}" ]; then echo "no report dir produced"; exit 0; fi
          git config user.email "ci@local" && git config user.name "ci-bot"
          # Reuse the branch when it exists — a fresh --orphan per failure
          # force-overwrites and clobbers reports from other failing jobs.
          git fetch origin ci-reports 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/ci-reports; then
            git checkout -B ci-reports-local origin/ci-reports
          else
            git checkout --orphan ci-reports-local && git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p reports && cp -r "${report_dir}" "reports/${GITHUB_SHA::7}-deploy-pages"
          git add -A reports && git commit -qm "gate report ${GITHUB_SHA::7}" \
            && git push -qf origin HEAD:ci-reports || echo "report push failed"

      - name: Deploy dist/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — build+tests passed, deploy skipped."
            exit 0
          fi
          npx wrangler pages deploy dist --project-name=nong-trai --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="${{ github.event.head_commit.message }}"
